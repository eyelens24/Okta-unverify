<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scuffathon Verify — Sign In</title>
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>
  <div class="top-bar"></div>

  <div class="login-wrap">
    <p class="page-heading">Sign in to your account</p>

    <svg class="crest" viewBox="0 0 200 232" role="img" aria-label="Scuffathon crest" xmlns="http://www.w3.org/2000/svg">
      <!-- Original shield emblem (not based on any real institution's mark) -->
      <!-- outer shield -->
      <path d="M100,8 C70,22 40,24 22,20 L22,95 C22,150 58,190 100,213 C142,190 178,150 178,95 L178,20 C160,24 130,22 100,8 Z"
            fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round" />
      <!-- inner shield border (ornate double line) -->
      <path d="M100,18 C73,30 45,32 31,29 L31,93 C31,143 63,179 100,200 C137,179 169,143 169,93 L169,29 C155,32 127,30 100,18 Z"
            fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round" />
      <!-- star above the book -->
      <path d="M100,80 L106.6,99 L126.7,99.4 L110.6,111.5 L116.5,130.7 L100,119.2 L83.5,130.7 L89.4,111.5 L73.3,99.4 L93.4,99 Z"
            fill="#fff" />
    </svg>

    <h1 class="login-title">Log in</h1>

    <!-- Step 1: username -->
    <form id="step-username">
      <div class="field">
        <label for="username">Username</label>
        <div class="hint">e.g. jsmith (not email address)</div>
        <input type="text" id="username" autocomplete="username" autofocus />
      </div>
      <button type="submit" class="btn"><span class="arrow">&#8594;</span> Next</button>
    </form>

    <!-- Step 2: password -->
    <form id="step-password" hidden>
      <div class="field">
        <label for="password">Password</label>
        <div class="hint" id="username-echo"></div>
        <input type="password" id="password" autocomplete="current-password" />
      </div>
      <button type="submit" class="btn"><span class="arrow">&#8594;</span> Log in</button>
    </form>

    <div class="message" id="login-message"></div>

    <div class="links">
      <a href="#" onclick="return false">Unlock account?</a>
      <a href="#" onclick="return false">Help</a>
      <a href="#" onclick="return false">Privacy collection notice</a>
    </div>
  </div>

  <script src="js/state.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
